<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yang MaYuBo</title>
  <meta name="description" content="Personal academic homepage">
  <meta name="theme-color" content="#01030a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <canvas id="liquid" aria-hidden="true"></canvas>

  <header class="nav" id="nav">
    <div class="nav-inner">
      <a class="brand" id="brand" href="#about"></a>
      <button class="nav-toggle" type="button" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav aria-label="Primary">
        <a href="#about">About</a>
        <a href="#education">Education</a>
        <a href="#research">Research</a>
        <a href="#publications">Publications</a>
        <a href="#service">Service</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section id="about" class="hero" aria-labelledby="neon-name">
      <p class="eyebrow">Personal Academic Homepage</p>
      <h1 id="neon-name" class="neon-name"></h1>
      <div class="hero-meta">
        <p class="role" id="role"></p>
        <div class="bio panel" id="bio"></div>
        <div class="interests" id="interests"></div>
        <div class="collab" id="collab"></div>
        <div class="links" id="links"></div>
      </div>
      <a class="scroll-hint" href="#education" aria-label="Scroll to Education"><span></span></a>
    </section>

    <section id="education" class="section">
      <div class="sec-head"><span class="sec-idx">01</span><h2 class="neon-title">Education</h2></div>
      <ol class="timeline"></ol>
    </section>

    <section id="research" class="section">
      <div class="sec-head"><span class="sec-idx">02</span><h2 class="neon-title">Research</h2></div>
      <ol class="timeline"></ol>
    </section>

    <section id="publications" class="section">
      <div class="sec-head">
        <span class="sec-idx">03</span><h2 class="neon-title">Publications</h2>
        <div class="filters" id="pub-filters" role="group" aria-label="Filter publications">
          <button type="button" data-mode="selected">Selected</button>
          <button type="button" data-mode="all">All</button>
        </div>
      </div>
      <p class="note" id="pub-note"></p>
      <div id="pub-list"></div>
      <noscript><p class="note">Please enable JavaScript to view the publication list.</p></noscript>
    </section>

    <section id="service" class="section">
      <div class="sec-head"><span class="sec-idx">04</span><h2 class="neon-title">Academic Service</h2></div>
      <div class="panel"><dl class="service" id="service-list"></dl></div>
    </section>
  </main>

  <footer id="footer"></footer>

  <button id="to-top" type="button" aria-label="Back to top">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5l-7 7 1.4 1.4L11 8.8V20h2V8.8l4.6 4.6L19 12z"/></svg>
  </button>

  <script src="data.js" defer></script>
  <script src="liquid.js" defer></script>
  <script src="main.js" defer></script>
</body>
</html>
